<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <title>Kalender - HoldMoney</title>
    <style>
        .fc .fc-button-primary {
            background-color: #4f46e5;
            border: none;
        }
        
        .fc .fc-button-primary:hover {
            background-color: #4338ca;
        }
        
        .fc-event {
            cursor: pointer;
            padding: 2px 6px;
            font-size: 0.75rem;
            border-radius: 6px;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] font-sans">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-[#1E293B] text-white p-6">
            <h2 class="text-2xl font-black text-indigo-400 mb-10">HoldMoney.</h2>
            <nav class="space-y-4">
                <a href="dashboard.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Ringkasan</a>
                <a href="transaksi.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Transaksi</a>
                <a href="anggaran.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Anggaran</a>
                <a href="tabungan.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Tabungan</a>
                <a href="kalender.html" class="block py-2 px-4 bg-indigo-600 rounded-xl font-bold">Kalender</a>
                <a href="kategori.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Kategori</a>
            </nav>
            <div class="mt-auto pt-10">
                <button onclick="handleLogout()" class="flex items-center w-full py-2 px-4 text-rose-400 hover:bg-slate-700 rounded-xl transition font-bold">
                <span class="mr-2">⏻</span> Logout
                </button>
        </aside>

        <main class="flex-1 p-10">
            <header class="mb-8">
                <h1 class="text-3xl font-extrabold text-slate-800">Kalender Transaksi</h1>
                <p class="text-slate-500">Lihat jadwal pemasukan dan pengeluaran Anda.</p>
            </header>

            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                <div id='calendar'></div>
            </div>
        </main>
        </div>

        <script src="script.js"></script>
        <script>
            // Tambahkan fungsi ini agar fetch bisa berjalan
            async function fetchData(endpoint) {
                try {
                    const response = await fetch(`http://localhost:5000${endpoint}`);
                    if (!response.ok) throw new Error("Gagal load");
                    return await response.json();
                } catch (err) {
                    console.error("Error:", err);
                    return [];
                }
            }

            document.addEventListener('DOMContentLoaded', async function() {
                // 1. Fetch data
                const trans = await fetchData('/transactions/by-date');
                console.log("Data yang diterima:", trans); // Cek ini di console untuk memastikan data ada

                // 2. Mapping data dengan pengecekan nama kolom
                const events = trans.map(t => {
                    // Kita gunakan '||' sebagai backup jika nama kolom di database Anda berbeda
                    const tgl = t.date || t.tanggal;
                    const desc = t.description || t.keterangan || 'Transaksi';
                    const type = (t.type || '').toLowerCase();

                    return {
                        title: `${desc} (Rp ${Number(t.amount).toLocaleString('id-ID')})`,
                        start: tgl,
                        backgroundColor: type === 'pemasukan' ? '#10b981' : '#f43f5e',
                        borderColor: type === 'pemasukan' ? '#10b981' : '#f43f5e',
                        textColor: '#ffffff'
                    };
                });

                // 3. Render Kalender
                var calendarEl = document.getElementById('calendar');
                var calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    events: events,
                    locale: 'id',
                    displayEventTime: false,
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,dayGridWeek'
                    },
                    dayMaxEvents: 3
                });
                calendar.render();
            });

            function handleLogout() {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        </script>
</body>

</html>
