<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Masuk - HoldMoney</title>
</head>

<body class="bg-[#0F172A] flex items-center justify-center min-h-screen">
    <!-- Card Dark Theme -->
    <div class="bg-[#1E293B] p-10 rounded-3xl shadow-2xl w-full max-w-sm border border-[#334155]">

        <!-- Logo HM -->
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-900/50">
                <span class="text-white text-2xl font-black">HM</span>
            </div>
        </div>

        <h2 class="text-2xl font-extrabold mb-8 text-center text-white">Masuk Akun</h2>

        <!-- Input field Dark Theme -->
        <input id="user" class="w-full p-4 mb-4 bg-[#0F172A] border border-[#334155] text-white rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Username">
        <input id="pass" type="password" class="w-full p-4 mb-6 bg-[#0F172A] border border-[#334155] text-white rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Password">

        <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-900">Masuk</button>

        <p class="text-center text-slate-400 text-xs mt-6">© 2026 HoldMoney</p>
    </div>

    <script src="script.js"></script>
    <script>
        async function handleLogin() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            const isSuccess = await loginUser(user, pass);

            if (isSuccess) {
                window.location.href = 'dashboard.html';
            } else {
                alert('Login Gagal, periksa username/password Anda.');
            }
        }
    </script>
</body>

</html>
