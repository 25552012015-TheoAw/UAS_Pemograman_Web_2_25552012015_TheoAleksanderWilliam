<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Transaksi - HoldMoney</title>
</head>

<body class="bg-[#0F172A] font-sans text-white">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-[#1E293B] p-6 flex flex-col">
            <h2 class="text-2xl font-black text-indigo-400 mb-10">HoldMoney.</h2>
            <nav class="space-y-4">
                <a href="dashboard.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Ringkasan</a>
                <a href="transaksi.html" class="block py-2 px-4 bg-indigo-600 rounded-xl font-bold">Transaksi</a>
                <a href="anggaran.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Anggaran</a>
                <a href="tabungan.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Tabungan</a>
                <a href="kalender.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Kalender</a>
                <a href="kategori.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Kategori</a>
            </nav>
            <div class="mt-auto pt-10">
                <button onclick="handleLogout()" class="flex items-center w-full py-2 px-4 text-rose-400 hover:bg-slate-700 rounded-xl transition font-bold">
                    <span class="mr-2">⏻</span> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 p-10">
            <header class="mb-8">
                <h1 class="text-3xl font-extrabold text-white">Tambah Transaksi</h1>
                <p class="text-slate-400">Catat pemasukan atau pengeluaran baru Anda.</p>
            </header>

            <div class="max-w-xl bg-[#1E293B] p-8 rounded-2xl border border-[#334155]">
                <form id="transForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-slate-300 mb-2">Deskripsi</label>
                        <input type="text" id="desc" class="w-full p-3 bg-[#0F172A] border border-[#334155] text-white rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-300 mb-2">Jumlah (Rp)</label>
                        <input type="number" id="amount" class="w-full p-3 bg-[#0F172A] border border-[#334155] text-white rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-300 mb-2">Tipe</label>
                            <select id="type" class="w-full p-3 bg-[#0F172A] border border-[#334155] text-white rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="pengeluaran">Pengeluaran</option>
                                <option value="pemasukan">Pemasukan</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-300 mb-2">Kategori</label>
                            <select id="category_id" class="w-full p-3 bg-[#0F172A] border border-[#334155] text-white rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" required>
                                <option value="" disabled selected>Pilih Kategori</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Simpan Transaksi</button>
                </form>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // PENTING: Load kategori dan simpan ID sebagai value
        async function loadCategories() {
            const categories = await fetchData('/categories');
            const select = document.getElementById('category_id');
            select.innerHTML = '<option value="" disabled selected>Pilih Kategori</option>';
            categories.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id; // SIMPAN ID (Kunci Relasi)
                opt.textContent = c.name;
                select.appendChild(opt);
            });
        }

        document.getElementById('transForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const data = {
                description: document.getElementById('desc').value,
                amount: document.getElementById('amount').value,
                type: document.getElementById('type').value,
                category_id: document.getElementById('category_id').value // Kirim ID
            };

            await addTransaction(data);
            alert("Transaksi berhasil dicatat!");
            document.getElementById('transForm').reset();
        });

        loadCategories();
    </script>
</body>

</html>
