<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Anggaran - HoldMoney</title>
</head>

<body class="bg-[#F8FAFC] font-sans">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-[#1E293B] text-white p-6">
            <h2 class="text-2xl font-black text-indigo-400 mb-10">HoldMoney.</h2>
            <nav class="space-y-4">
                <a href="dashboard.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Ringkasan</a>
                <a href="transaksi.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Transaksi</a>
                <a href="anggaran.html" class="block py-2 px-4 bg-indigo-600 rounded-xl font-bold">Anggaran</a>
                <a href="tabungan.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Tabungan</a>
                <a href="kalender.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Kalender</a>
                <a href="kategori.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Kategori</a>
            </nav>
        </aside>

        <main class="flex-1 p-10">
            <header class="mb-8">
                <h1 class="text-3xl font-extrabold text-slate-800">Manajemen Anggaran</h1>
                <p class="text-slate-500">Pantau pengeluaran berdasarkan kategori.</p>
            </header>

            <div id="anggaranContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            </div>
        </main>
    </div>

    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl w-96 shadow-xl">
            <h3 class="font-bold text-lg mb-4">Edit Limit Anggaran</h3>
            <input type="number" id="editLimitInput" class="w-full p-3 border border-slate-300 rounded-xl mb-4" placeholder="Masukkan limit baru">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-xl">Batal</button>
                <button id="saveBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700">Simpan</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Fungsi global agar bisa dipanggil dari tombol HTML
        function openModal(id, currentLimit) {
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editLimitInput').value = currentLimit;
            document.getElementById('saveBtn').onclick = () => saveBudget(id);
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveBudget(id) {
            const newLimit = document.getElementById('editLimitInput').value;
            await fetch(`/budgets/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    limit: newLimit
                })
            });
            closeModal();
            loadAnggaran(); // Refresh data
        }

        async function loadAnggaran() {
            try {
                const [trans, budgets] = await Promise.all([
                    fetchData('/transactions'),
                    fetchData('/budgets')
                ]);

                const container = document.getElementById('anggaranContainer');
                container.innerHTML = budgets.map(b => {
                    const used = trans.filter(t => t.category === b.cat && t.type === 'pengeluaran')
                        .reduce((sum, t) => sum + parseFloat(t.amount), 0);
                    const percent = Math.min((used / b.limit) * 100, 100);
                    const color = percent > 90 ? 'bg-rose-500' : 'bg-indigo-500';

                    return `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-slate-800">${b.cat}</h3>
                            <button onclick="openModal('${b.id}', ${b.limit})" class="text-xs text-indigo-600 font-bold hover:underline">Edit</button>
                        </div>
                        <div class="flex justify-between text-xs mt-3 mb-2 font-medium">
                            <span class="text-slate-500">Terpakai: Rp ${used.toLocaleString('id-ID')}</span>
                            <span class="text-slate-800">Budget: Rp ${b.limit.toLocaleString('id-ID')}</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-3">
                            <div class="${color} h-3 rounded-full transition-all" style="width: ${percent}%"></div>
                        </div>
                    </div>`;
                }).join('');
            } catch (err) {
                console.error("Gagal memuat anggaran:", err);
            }
        }

        // Jalankan saat halaman dibuka
        loadAnggaran();
    </script>
</body>

</html>
