<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>HoldMoney - Dashboard</title>
</head>

<body class="bg-[#0F172A] font-sans text-slate-100">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-[#1E293B] p-6 border-r border-[#334155]">
            <h2 class="text-2xl font-black text-indigo-400 mb-10">HoldMoney.</h2>
            <nav class="space-y-4">
                <a href="dashboard.html" class="block py-2 px-4 bg-indigo-600 rounded-xl font-bold">Ringkasan</a>
                <a href="transaksi.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Transaksi</a>
                <a href="anggaran.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Anggaran</a>
                <a href="tabungan.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Tabungan</a>
                <a href="kalender.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Kalender</a>
                <a href="kategori.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Kategori</a>
            </nav>
            <button onclick="handleLogout()" class="mt-10 flex items-center w-full py-2 px-4 text-rose-400 hover:bg-slate-700 rounded-xl transition font-bold">
                <span class="mr-2">⏻</span> Logout
            </button>
        </aside>

        <main class="flex-1 p-10">
            <h1 class="text-3xl font-extrabold text-white mb-8">Ringkasan Keuangan</h1>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-[#1E293B] p-6 rounded-2xl border border-[#334155]">
                    <p class="text-sm text-slate-400">Total Pemasukan</p>
                    <h3 id="inc" class="text-xl font-bold text-emerald-400">Rp 0</h3>
                </div>
                <div class="bg-[#1E293B] p-6 rounded-2xl border border-[#334155]">
                    <p class="text-sm text-slate-400">Total Pengeluaran</p>
                    <h3 id="exp" class="text-xl font-bold text-rose-400">Rp 0</h3>
                </div>
                <div class="bg-[#1E293B] p-6 rounded-2xl border border-[#334155]">
                    <p class="text-sm text-slate-400">Total Tabungan</p>
                    <h3 id="sav" class="text-xl font-bold text-indigo-400">Rp 0</h3>
                </div>
                <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-6 rounded-2xl">
                    <p class="text-indigo-100 text-sm">Sisa Saldo</p>
                    <h3 id="bal" class="text-xl font-bold text-white">Rp 0</h3>
                </div>
            </div>

            <div class="bg-[#1E293B] p-8 rounded-2xl border border-[#334155] mb-8">
                <div class="h-[250px]"><canvas id="financeChart"></canvas></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-[#1E293B] p-8 rounded-2xl border border-[#334155]">
                    <h3 class="font-bold text-white mb-4">Rincian Pengeluaran</h3>
                    <div id="categorySummary" class="space-y-3"></div>
                </div>
                <div class="bg-[#1E293B] p-8 rounded-2xl border border-[#334155]">
                    <h3 class="font-bold text-white mb-4">Status Anggaran</h3>
                    <div id="budgetMonitor" class="space-y-3"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let myChart;
        async function fetchData(endpoint) {
            try {
                const response = await fetch(`http://localhost:5000${endpoint}`);
                return await response.json();
            } catch (err) {
                return [];
            }
        }

        async function initDashboard() {
            const [transaksi, catSummary, budgetData, tabungan] = await Promise.all([
                fetchData('/transactions'),
                fetchData('/transactions/by-category'),
                fetchData('/budgets'),
                fetchData('/savings')
            ]);

            // Hitung Saldo
            let inc = 0,
                exp = 0;
            transaksi.forEach(t => {
                const val = Number(t.amount) || 0;
                if (String(t.type).toLowerCase() === 'pemasukan') inc += val;
                else exp += val;
            });
            const totalTabungan = tabungan.reduce((sum, s) => sum + Number(s.current_amount), 0);

            // Update UI
            document.getElementById('inc').innerText = `Rp ${inc.toLocaleString('id-ID')}`;
            document.getElementById('exp').innerText = `Rp ${exp.toLocaleString('id-ID')}`;
            document.getElementById('sav').innerText = `Rp ${totalTabungan.toLocaleString('id-ID')}`;
            document.getElementById('bal').innerText = `Rp ${(inc - exp - totalTabungan).toLocaleString('id-ID')}`;

            // Render List Kategori
            document.getElementById('categorySummary').innerHTML = catSummary.map(c => `
                <div class="flex justify-between bg-[#0F172A] p-3 rounded-lg border border-[#334155]">
                    <span class="text-slate-300">${c.name}</span>
                    <span class="text-rose-400 font-bold">Rp ${Number(c.total).toLocaleString('id-ID')}</span>
                </div>`).join('');

            // Render Anggaran
            document.getElementById('budgetMonitor').innerHTML = budgetData.map(b => {
                const match = catSummary.find(c => c.name.toLowerCase() === b.cat.toLowerCase());
                const used = match ? Number(match.total) : 0;
                return `
                <div class="bg-[#0F172A] p-3 rounded-lg border border-[#334155]">
                    <div class="flex justify-between mb-1">
                        <span class="text-slate-300">${b.cat}</span>
                        <span class="${(b.limit - used) < 0 ? 'text-rose-400' : 'text-emerald-400'} font-bold">Sisa: Rp ${(b.limit - used).toLocaleString('id-ID')}</span>
                    </div>
                </div>`;
            }).join('');

            // Grafik
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Awal', 'Sekarang'],
                    datasets: [{
                        label: 'Pemasukan',
                        data: [0, inc],
                        borderColor: '#10b981'
                    }, {
                        label: 'Pengeluaran',
                        data: [0, exp],
                        borderColor: '#f43f5e'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initDashboard);

        function handleLogout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
