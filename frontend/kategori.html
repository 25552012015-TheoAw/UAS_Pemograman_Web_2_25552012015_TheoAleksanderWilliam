<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Kategori - HoldMoney</title>
</head>

<body class="bg-[#0F172A] font-sans text-white">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-[#1E293B] p-6 flex flex-col">
            <h2 class="text-2xl font-black text-indigo-400 mb-10">HoldMoney.</h2>
            <nav class="space-y-4">
                <a href="dashboard.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Ringkasan</a>
                <a href="transaksi.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Transaksi</a>
                <a href="anggaran.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Anggaran</a>
                <a href="tabungan.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Tabungan</a>
                <a href="kalender.html" class="block py-2 px-4 hover:bg-slate-700 rounded-xl transition">Kalender</a>
                <a href="kategori.html" class="block py-2 px-4 bg-indigo-600 rounded-xl font-bold">Kategori</a>
            </nav>
            <div class="mt-auto pt-10">
                <button onclick="handleLogout()" class="flex items-center w-full py-2 px-4 text-rose-400 hover:bg-slate-700 rounded-xl transition font-bold">
                    <span class="mr-2">⏻</span> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 p-10">
            <header class="mb-8">
                <h1 class="text-3xl font-extrabold text-white">Kelola Kategori</h1>
                <p class="text-slate-400">Atur pengelompokan transaksi Anda.</p>
            </header>

            <div class="max-w-2xl">
                <div class="bg-[#1E293B] p-6 rounded-2xl border border-[#334155] mb-6">
                    <form id="catForm" class="flex gap-4">
                        <input type="text" id="catName" placeholder="Nama kategori baru..." class="flex-grow p-3 bg-[#0F172A] border border-[#334155] text-white rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" required>
                        <button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Tambah</button>
                    </form>
                </div>

                <div class="bg-[#1E293B] p-6 rounded-2xl border border-[#334155]">
                    <ul id="catList" class="divide-y divide-[#334155]">
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        async function loadCategories() {
            const categories = await fetchData('/categories');
            const list = document.getElementById('catList');

            if (categories.length === 0) {
                list.innerHTML = '<li class="py-4 text-slate-500 text-center">Belum ada kategori.</li>';
                return;
            }

            list.innerHTML = categories.map(cat => `
                <li class="py-4 flex justify-between items-center">
                    <span class="font-medium text-slate-200">${cat.name}</span>
                    <button onclick="deleteCategory(${cat.id})" class="text-rose-400 hover:text-rose-300 text-sm font-bold">Hapus</button>
                </li>
            `).join('');
        }

        document.getElementById('catForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const name = document.getElementById('catName').value;
            await addCategory(name);
            document.getElementById('catName').value = '';
            loadCategories();
        });

        loadCategories();
    </script>
</body>

</html>
